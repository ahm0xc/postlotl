services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: postlotl-api
    ports:
      - "5200:5200"
    environment:
      PORT: 5200
      POSTGRES_HOST: postgres
    env_file:
      - path: .env
        required: false
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
    image: postlotl-dashboard
    ports:
      - "5100:5100"
    environment:
      PORT: 5100
    env_file:
      - path: .env
        required: false
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: postlotl
      POSTGRES_USER: postlotl
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postlotl -d postlotl"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres-data:
