services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: postlotl-web
    ports:
      - "5100:5100"
    environment:
      PORT: 5100
      POSTGRES_HOST: postgres
    env_file:
      - path: apps/web/.env
        required: false
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    ports:
      - "5432:5432"
    env_file:
      - path: apps/web/.env
        required: false
    environment:
      POSTGRES_DB: postlotl
      POSTGRES_USER: postlotl
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postlotl -d postlotl"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres-data:
